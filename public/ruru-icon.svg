<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">如如的代码幻想乡 App 图标</title>
  <desc id="desc">深蓝粉紫霓虹猫耳代码徽章</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="70" x2="900" y2="950" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#101456"/>
      <stop offset="0.48" stop-color="#071846"/>
      <stop offset="1" stop-color="#020a2a"/>
    </linearGradient>
    <linearGradient id="frame" x1="70" y1="90" x2="930" y2="940" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff72ed"/>
      <stop offset="0.45" stop-color="#a85bff"/>
      <stop offset="1" stop-color="#5577ff"/>
    </linearGradient>
    <linearGradient id="symbol" x1="250" y1="290" x2="790" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffe0f8"/>
      <stop offset="0.42" stop-color="#ff83de"/>
      <stop offset="0.72" stop-color="#b57aff"/>
      <stop offset="1" stop-color="#6987ff"/>
    </linearGradient>
    <linearGradient id="ear" x1="330" y1="170" x2="690" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffd3f3"/>
      <stop offset="1" stop-color="#f06bd8"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="48%" r="58%">
      <stop stop-color="#d76bff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#6d43ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.9  0 0.4 0 0 0.1  0 0 1 0 0.9  0 0 0 0.8 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="symbolGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="13" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000521" flood-opacity="0.72"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect x="28" y="28" width="968" height="968" rx="205" fill="none" stroke="url(#frame)" stroke-width="36" filter="url(#softGlow)"/>
  <rect x="62" y="62" width="900" height="900" rx="174" fill="none" stroke="#efdcff" stroke-opacity="0.32" stroke-width="3"/>
  <rect x="82" y="82" width="860" height="860" rx="154" fill="url(#centerGlow)"/>

  <g opacity="0.55" stroke-linecap="round" fill="none">
    <path d="M96 282h92l38-38h76" stroke="#8f63ff" stroke-width="9"/>
    <path d="M806 174h70v72h72" stroke="#d95cff" stroke-width="8"/>
