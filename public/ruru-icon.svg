    <path d="M72 742h74l44-44h56" stroke="#5f82ff" stroke-width="8"/>
    <circle cx="302" cy="244" r="9" fill="#ff86df" stroke="none"/>
    <circle cx="876" cy="174" r="9" fill="#9a70ff" stroke="none"/>
    <circle cx="886" cy="828" r="8" fill="#ff7edb" stroke="none"/>
    <circle cx="190" cy="698" r="8" fill="#767dff" stroke="none"/>
  </g>

  <g filter="url(#shadow)">
    <path d="M306 316C288 234 318 164 376 130L486 254" fill="none" stroke="url(#frame)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M718 316C736 234 706 164 648 130L538 254" fill="none" stroke="url(#frame)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M331 296C321 241 337 201 375 177L449 264" fill="url(#ear)" stroke="#ffe8fb" stroke-opacity="0.72" stroke-width="8" stroke-linejoin="round"/>
    <path d="M693 296C703 241 687 201 649 177L575 264" fill="url(#ear)" stroke="#ffe8fb" stroke-opacity="0.72" stroke-width="8" stroke-linejoin="round"/>

    <circle cx="512" cy="512" r="320" fill="#06123d" stroke="url(#frame)" stroke-width="34"/>
    <circle cx="512" cy="512" r="286" fill="none" stroke="#f0d9ff" stroke-opacity="0.22" stroke-width="4"/>

    <g filter="url(#symbolGlow)" stroke="url(#symbol)" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M410 374L268 512l142 138" stroke-width="86"/>
