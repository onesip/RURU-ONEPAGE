    <path d="M753 674c45 4 76 35 76 76 0 48-42 78-106 102 19-40 18-72-1-104-17-30-4-69 31-74z" fill="url(#ear)" stroke="#fff0ff" stroke-opacity="0.75" stroke-width="8"/>
    <path d="M690 839c82-11 137-48 158-112" fill="none" stroke="url(#frame)" stroke-width="23" stroke-linecap="round"/>
    <circle cx="869" cy="706" r="13" fill="#fa8be0"/>
  </g>

  <g fill="#ffe9fb">
    <path d="M160 221l12 28 28 12-28 12-12 28-12-28-28-12 28-12z"/>
    <path d="M849 298l10 23 23 10-23 10-10 23-10-23-23-10 23-10z"/>
    <path d="M184 771l13 30 30 13-30 13-13 30-13-30-30-13 30-13z"/>
    <path d="M849 809l9 21 21 9-21 9-9 21-9-21-21-9 21-9z"/>
    <circle cx="254" cy="184" r="8" fill="#ff7fde"/>
    <circle cx="802" cy="194" r="7" fill="#8d75ff"/>
    <circle cx="258" cy="862" r="7" fill="#8d75ff"/>
  </g>

  <text x="512" y="925" text-anchor="middle" fill="#f5a6e7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="46" font-weight="800" letter-spacing="19">RURU</text>
</svg>
