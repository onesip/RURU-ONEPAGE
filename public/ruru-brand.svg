<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 230" role="img" aria-labelledby="title desc">
  <title id="title">如如的代码幻想乡</title>
  <desc id="desc">猫耳代码徽章与粉紫品牌字标</desc>
  <defs>
    <linearGradient id="brand" x1="70" y1="40" x2="960" y2="205" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff9be8"/>
      <stop offset="0.48" stop-color="#cb79ff"/>
      <stop offset="1" stop-color="#7690ff"/>
    </linearGradient>
    <linearGradient id="dark" x1="30" y1="20" x2="225" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172061"/>
      <stop offset="1" stop-color="#06113b"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-50%" width="140%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#02071e" flood-opacity="0.7"/>
    </filter>
  </defs>

  <g transform="translate(12 6)" filter="url(#shadow)">
