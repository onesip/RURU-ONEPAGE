    <path d="M58 82C50 50 64 28 88 20l34 43" fill="none" stroke="url(#brand)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M160 82c8-32-6-54-30-62L96 63" fill="none" stroke="url(#brand)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="109" cy="117" r="70" fill="#07133f" stroke="url(#brand)" stroke-width="9"/>
    <g fill="none" stroke="url(#brand)" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
      <path d="M86 88l-31 29 31 29" stroke-width="18"/>
      <path d="M132 88l31 29-31 29" stroke-width="18"/>
      <path d="M120 80l-22 75" stroke-width="18"/>
    </g>
    <path d="M109 99l7 17 17 7-17 7-7 17-7-17-17-7 17-7z" fill="#fff8ff"/>
    <path d="M161 157c19 2 30 14 30 30 0 17-15 28-39 37 7-15 7-26 0-38-6-11 0-27 9-29z" fill="#f78cde" stroke="#fff1fb" stroke-width="3"/>
  </g>

  <g transform="translate(242 30)" filter="url(#shadow)">
    <text x="0" y="83" fill="#fff" stroke="#5a2a9b" stroke-width="4" paint-order="stroke" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="70" font-weight="900" letter-spacing="2">如如的代码幻想乡</text>
    <text x="4" y="142" fill="url(#brand)" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="900" letter-spacing="10">RURU APP</text>
    <path d="M0 162h575" stroke="url(#brand)" stroke-width="4" stroke-linecap="round" opacity="0.72"/>
    <path d="M620 128c31 0 47 17 47 36 0 23-21 37-54 48 9-18 9-33 0-49-8-14-2-34 7-35z" fill="#f68bdc"/>
